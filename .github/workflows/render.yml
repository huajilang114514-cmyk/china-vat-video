name: Render Video

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "分辨率缩放：1 = 1080p，0.75 = 1440x810，0.5 = 960x540"
        required: true
        default: "1"
      frames:
        description: "可选帧范围，如 0-299（留空渲染全片）"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libatspi2.0-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 libx11-xcb1 fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Render
        run: |
          EXTRA=""
          if [ -n "${{ inputs.frames }}" ]; then EXTRA="--frames=${{ inputs.frames }}"; fi
          CORES=$(nproc)
          if [ "$CORES" -gt 4 ]; then CORES=4; fi
          echo "Rendering with concurrency=$CORES"
          npx remotion render src/index.ts VatExplainer out/vat-video.mp4 --scale=${{ inputs.scale }} --concurrency=$CORES $EXTRA

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: vat-video
          path: out/*.mp4
          retention-days: 14
